function getParam(name) {
  var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

function render() {
  var section = getParam('section');
  var filtered = section ? articles.filter(function(a){ return a.section === section; }) : articles;

  // Update nav active state
  document.querySelectorAll('.cat-nav a').forEach(function(a){ a.classList.remove('active'); });
  var navLink = document.querySelector('.nav-' + section);
  if (navLink) navLink.classList.add('active');

  // Title
  var title = section ? (sectionNames[section] || section) : '全部报道';
  document.getElementById('sectionTitle').textContent = title;

  // Update page title
  document.title = (section ? (sectionNames[section] + ' — ') : '') + 'Tech Observer 科技观察';

  // Date
  var now = new Date();
  var days = ['日','一','二','三','四','五','六'];
  document.getElementById('topDate').textContent =
    now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 · 星期' + days[now.getDay()];

  // Build cards
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var a = filtered[i];
    var imgTag = a.img
      ? '<img src=\"' + a.img + '\" alt=\"' + a.alt + '\" style=\"width:100%;height:100%;object-fit:cover;\">'
      : '';
    html += '<div class=\"news-card sec-' + a.section + '\">' +
      '<div class=\"card-thumb\">' + imgTag + '</div>' +
      '<div class=\"card-body\">' +
      '<span class=\"section-label\">' + a.label + '</span>' +
      '<h3><a href=\"' + a.path + '\">' + a.title + '</a></h3>' +
      '<div class=\"blurb\">' + a.blurb + '</div>' +
      '<div class=\"meta\">' + a.date + ' · ' + a.author + '</div>' +
      '</div></div>';
  }
  document.getElementById('articleGrid').innerHTML = html || '<p style=\"grid-column:1/-1;color:var(--ink-dim);padding:2em 0;\">该栏目下暂无报道。</p>';
}

render();
